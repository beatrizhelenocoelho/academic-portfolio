# Window size in pixels
window_size = 800;

# Number of planets in the simulation
planet_number = 10;

# Maximum number of trash pieces
max_trash = 10;

# Initial trash at start
initial_trash = 5;

# Trash capacity for ships
trash_capacity = 5;

# Radius for drawing
planet_radius = 20;
trash_radius = 5;
player_radius = 12;

colors:
{
    # Background color (semi-transparent white)
    white = { r = 255; g = 255; b = 255; a = 128 };

    # Color for ships
    black = { r = 0; g = 0; b = 0; a = 255 };

    # Color for planets that are NOT recycling
    red   = { r = 255; g = 0; b = 0; a = 255 };

    # Color for recycling planets
    blue  = { r = 0; g = 0; b = 255; a = 255 };

    # Color for trash pieces
    green = { r = 0; g = 255; b = 0; a = 255 };
};
